# ~/.config/wallengine/config.ini  -- command-line options override these.

# desktop = behind your windows (default), root = draw on the root window
# (for WMs without a desktop manager), window = normal window (testing)
mode = desktop
fps = 30

# A file, a directory (scanned recursively) or a comma-separated list.
# Empty = the bundled samples.
playlist =
interval = 0            # seconds between automatic switches, 0 = never
shuffle = false
transition = 1.5        # crossfade seconds
span = false            # one wallpaper across all monitors
different = false       # different wallpaper per monitor

# Fixed wallpaper per monitor (index from `wallengine --list-monitors`)
#monitor0 = ~/Wallpapers/forest.mp4
#monitor1 = ~/shaders/sea.frag

# Defaults for images/videos (a .scene file can override them)
fit = cover             # cover | contain | stretch | center
parallax = 0.02         # mouse parallax, 0 = off
effect = none           # none | snow | rain | fireflies | bokeh
visualizer = none       # none | bars | wave | circle
speed = 1.0

# Performance
pause_on_fullscreen = true
pause_on_maximized = false
pause_on_battery = false
video_max_width = 1920

# Audio-reactive input (system output monitor). Empty = auto (pw-record / parec)
audio = true
audio_cmd =

# Play the sound of video wallpapers (needs ffplay)
video_sound = false
volume = 50

# ---- Wallpaper Engine (Steam workshop) wallpapers ----
# The assets folder of Wallpaper Engine is found automatically in Steam's
# library; set it here if it lives elsewhere.
#assets_dir = ~/.steam/steam/steamapps/common/wallpaper_engine/assets
scaling = default       # default | stretch | fit | fill
clamp = clamp           # clamp | border | repeat
silent = false          # mute wallpaper sounds
wallpaper_volume = 15   # 0..128
automute = true         # mute while another application plays audio
audio_processing = true
disable_particles = false
disable_mouse = false
disable_parallax = false
